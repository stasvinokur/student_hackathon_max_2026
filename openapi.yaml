  /api/packs/{packId}/location-index:
    get:
      operationId: getLocationIndex
      summary: Снимок индекса мест (OpenStreetMap, ODbL) для вкладки «Карта»
      tags:
        - map
      parameters:
        - schema:
            type: string
            maxLength: 64
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          in: path
          name: packId
          required: true
          description: Rules pack id, e.g. kazan-coffee
        - schema:
            type: string
          in: header
          name: if-none-match
          required: false
          description: "ETag of the snapshot the client keeps: 304 while it is current"
      security: *a1
      responses:
        "200":
          description: "The snapshot file of the pack as is
            (content/<pack>/location-index.json): OpenStreetMap data, ODbL 1.0"
          headers:
            ETag:
              schema:
                type: string
              description: "Strong tag of the snapshot: the first 16 hex digits of its sha256,
                quoted. A compressing proxy (the stand has one) appends -gzip or
                -zstd: for a 304 send back the tag as received, with the same
                Accept-Encoding"
            Cache-Control:
              schema:
                type: string
              description: "private, no-cache: keep the snapshot, revalidate it with
                If-None-Match"
          content:
            application/json:
              schema:
                type: object
                properties:
                  format:
                    type: string
                    enum:
                      - otkryvay.location-index/1
                  pack:
                    type: string
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                  version:
                    type: string
                    pattern: ^\d{8}T\d{6}Z-[0-9a-f]{8}$
                  title:
                    type: string
                    minLength: 1
                  disclaimer:
                    type: string
                    minLength: 1
                  dataStatus:
                    type: string
                    enum:
                      - prepared_snapshot
                  linkedActions:
                    type: array
                    items:
                      type: string
                      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                  top:
                    type: object
                    properties:
                      size:
                        type: integer
                        minimum: 1
                        maximum: 9007199254740991
                      minSpacingCells:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                      - size
                      - minSpacingCells
                    additionalProperties: false
                  source:
                    type: object
                    properties:
                      name:
                        type: string
                        enum:
                          - OpenStreetMap
                      licence:
                        type: string
                        enum:
                          - ODbL-1.0
                      licenceUrl:
                        type: string
                        format: uri
                      attribution:
                        type: string
                        minLength: 1
                      attributionUrl:
                        type: string
                        format: uri
                      osmBase:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:Z))$
                      extractedAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                      endpoint:
                        type: string
                        format: uri
                      method:
                        type: string
                        format: uri
                      configSha256:
                        type: string
                        pattern: ^[0-9a-f]{64}$
                    required:
                      - name
                      - licence
                      - licenceUrl
                      - attribution
                      - attributionUrl
                      - osmBase
                      - extractedAt
                      - endpoint
                      - method
                      - configSha256
                    additionalProperties: false
                  grid:
                    type: object
                    properties:
                      origin:
                        type: object
                        properties:
                          lat:
                            type: number
                            minimum: -90
                            maximum: 90
                          lon:
                            type: number
                            minimum: -180
                            maximum: 180
                        required:
                          - lat
                          - lon
                        additionalProperties: false
                      cellMeters:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 5000
                      rows:
                        type: integer
                        minimum: 1
                        maximum: 4096
                      cols:
                        type: integer
                        minimum: 1
                        maximum: 4096
                      mPerDegLat:
                        type: number
                        exclusiveMinimum: 0
                      mPerDegLon:
                        type: number
                        exclusiveMinimum: 0
                    required:
                      - origin
                      - cellMeters
                      - rows
                      - cols
                      - mPerDegLat
                      - mPerDegLon
                    additionalProperties: false
                  criteria:
                    minItems: 1
                    maxItems: 64
                    type: array
                    items:
                      oneOf:
                        - type: object
                          properties:
                            id:
                              type: string
                              pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                            title:
                              type: string
                              minLength: 1
                            defaultImportance:
                              type: string
                              enum:
                                - "off"
                                - low
                                - medium
                                - high
                                - required
                            osm:
                              minItems: 1
                              type: array
                              items:
                                type: string
                                pattern: ^(node|way|rel|nwr)(\[[^[\];]+\])+$
                            featureCount:
