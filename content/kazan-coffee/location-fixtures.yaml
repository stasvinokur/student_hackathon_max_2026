# Эталонные точки индекса мест (doc-3 §3). Проверяются при каждой сборке снимка (отчёт скрипта location-index)
# и тестом на закоммиченном снимке — с важностью критериев по умолчанию. Координаты — из OpenStreetMap на 24.09.2026.
# expect:
#   included — есть ли квадрат точки в индексе;
#   level — уровни 0–100 по критериям: число — точно, { min, max } — границы включительно;
#   score — индекс 0–100 (перцентиль среди подходящих мест);
#   fact — слова, которые должны быть в факте критерия (как в карточке места); title — в названии места;
#   top_within_cells — место из топа не дальше стольких квадратов по строкам и столбцам: топ разносит места
#     на top.min_spacing_cells, поэтому хорошую точку может представлять соседний квадрат;
#   verdict — вердикт конкуренции: saturated, usual, niche.
pack: kazan-coffee
points:
  - id: kremlyovskaya
    title: Метро «Кремлёвская»
    note: >-
      Станция, node 9022338990. Входы без названий (только ref 1–4) берут имя станции, поэтому факт и название
      места называют станцию.
    lat: 55.7951768
    lon: 49.1070089
    expect:
      included: true
      level: { metro: 100 }
      fact: { metro: 'Метро «Кремлёвская»' }
      title: 'У метро «Кремлёвская»'

  - id: bauman
    title: Улица Баумана
    note: >-
      Точка из постановки задачи: середина пешеходной улицы Баумана (way 386031039). Одно из самых оживлённых
      мест города: пешеходный уровень высокий, рядом — место из топа. Факт здесь называет не Баумана: к центру
      квадрата ближе пересекающая её пешеходная улица Мусы Джалиля (до 50 м), поэтому название улицы
      проверяет точка bauman-south.
    lat: 55.7915
    lon: 49.1135
    expect:
      included: true
      level: { pedestrian: { min: 90 } }
      top_within_cells: 1

  - id: bauman-south
    title: Улица Баумана, южный участок
    note: >-
      Середина южного участка улицы, way 386031030: здесь ближайшая пешеходная улица — Баумана, и факт называет
      её. Название места «улица Баумана» (якорь с приоритетом 2, до 150 м) не выигрывает нигде на улице: у всех
      трёх квадратов, где она ближе 150 м, станция или вход метро ближе 400 м, а якорь метро — приоритет 1
      (до 700 м).
    lat: 55.78887
    lon: 49.11859
    expect:
      included: true
      fact: { pedestrian: 'улица Баумана' }
      top_within_cells: 1

  - id: volga
    title: Волга у Казани
    note: >-
      Куйбышевское водохранилище (natural=water, water=reservoir) внутри границы города: зданий и объектов
      спроса нет, квадрата в индексе быть не должно.
    lat: 55.77
    lon: 49.06
    expect:
      included: false

  - id: helicopter-plant
    title: Казанский вертолётный завод
    note: >-
      Территория завода, way 83888188 (landuse=industrial). Здания есть, место в индексе, но промзона занимает
      квадрат целиком: индекс — в нижней пятой части.
    lat: 55.8573
    lon: 49.0414
    expect:
      included: true
      level: { industrial: { min: 80 } }
      fact: { industrial: 'Промзона' }
      score: { max: 20 }

  - id: konstantinovka
    title: Жилой массив Константиновка
    note: >-
      Частные дома на северо-востоке города: дома есть — место в индексе, но ни одного объекта спроса рядом нет
      (многоквартирных домов, остановок ближе 500 м, офисов), поэтому индекс низкий.
    lat: 55.81691
    lon: 49.2661
    expect:
      included: true
      level: { transit: 0, residential: 0, office: 0 }
      score: { max: 20 }

  - id: sakharov
    title: Улица Академика Сахарова
    note: >-
      Здесь в OSM одинокий вход в метро без тегов сети, node 13387191918, в 3 км от ближайшей станции «Горки».
      Критерий «Метро» берёт только входы с тегом network, поэтому метро здесь не учитывается.
    lat: 55.78193
    lon: 49.21805
    expect:
      included: true
      level: { metro: 0 }
      fact: { metro: 'Метро дальше' }
