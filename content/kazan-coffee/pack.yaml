  - id: ready-food-storage
    title: Организовать хранение и выдачу готовой еды
    lane: ops
    applies_if: { field: sells_food, eq: true }
    depends_on: [fit-out]
    duration_days: 7
    due_days_before_opening: 2
    why: >-
      Выпечка и сэндвичи требуют отдельного холодильного хранения, контроля сроков годности
      и прослеживаемости поставок.
    do_now: >-
      Выберите поставщика готовой еды с документами, выделите холодильную витрину с термометром
      и добавьте контроль сроков в журналы производственного контроля.
    prepare:
      - Договор с поставщиком и документы на продукцию
      - Холодильная витрина с термометром
      - Журнал учёта сроков годности
    done_when: Поставщик выбран, витрина работает, сроки годности контролируются.
    source:
      url: https://www.garant.ru/products/ipo/prime/doc/414229257/
      title: СанПиН 2.3/2.4.4282-26 — хранение и реализация пищевой продукции
