    kind: test_data

  - id: haccp
    title: Внедрить процедуры ХАССП
    lane: ops
    depends_on: [production-control]
    duration_days: 10
    due_days_before_opening: 1
    why: >-
      ТР ТС 021/2011 обязывает изготовителей пищевой продукции, в том числе кофейни, работать
      по процедурам на принципах ХАССП.
    do_now: >-
      Опишите процессы (приёмка молока, хранение, приготовление, выдача), найдите критические точки —
      например, температуру холодильника — и заведите журналы их контроля.
    prepare:
      - Схема процессов
      - Критические точки и допустимые пределы
      - Журналы мониторинга
      - Приказ об ответственном
    done_when: Документы ХАССП утверждены, журналы ведутся с первого дня.
    source:
      url: https://base.garant.ru/70106650/
      title: ТР ТС 021/2011 «О безопасности пищевой продукции», ст. 10
      checked_at: 2026-09-18
