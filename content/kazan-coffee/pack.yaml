      Одна из организаций, где заказывают лабораторные исследования и оформляют медкнижки; подойдут и другие
      аккредитованные лаборатории и медицинские организации с лицензией.
    source:
      url: https://fbuz.tatarstan.ru/
      title: ФБУЗ «Центр гигиены и эпидемиологии в Республике Татарстан»
      checked_at: 2026-09-23

  - id: uag-kazan
    name: Управление архитектуры и градостроительства Исполкома Казани
    short_name: Управление архитектуры
    address: Казань, ул. Груздева, 5
    lat: 55.789050
    lon: 49.145109
    osm: way/405269942
    note: >-
      Согласование дизайн-проекта вывески; заявление — через Госуслуги или МФЦ, лично — по предварительной
      записи.
    source:
      url: https://kzn.ru/poluchit-uslugu/soglasovanie-proekta-razmeshcheniya-sredstva-naruzhnoy-informatsii-pasport/?lang=ru
