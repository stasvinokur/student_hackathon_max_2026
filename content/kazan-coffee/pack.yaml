  - id: tko-operator-kazan
    name: ООО «УК «ПЖКХ» — региональный оператор по обращению с ТКО
    short_name: Региональный оператор ТКО
    address: Казань, ул. Щапова, 14/31
    lat: 55.791581
    lon: 49.131453
    osm: node/12983549378
    note: >-
      Региональный оператор Западной зоны Татарстана, куда входит Казань; здесь заключают договоры с юрлицами
      и ИП.
    source:
      url: https://ukpgkh.ru/contact
      title: ООО «УК «ПЖКХ» — контакты регионального оператора
      checked_at: 2026-09-23

actions:
  # ---------------- critical: без этого открыться нельзя ----------------

  - id: register-business
    title: Зарегистрировать ИП или ООО с кодами общепита
    lane: critical
    applies_if: { field: legal_status, eq: none }
    duration_days: 7
    why: >-
      Без регистрации нельзя законно оказывать услуги общепита, заключить аренду на бизнес,
      зарегистрировать кассу и работать с «Честным знаком».
    do_now: >-
      Решите, ИП или ООО, и подайте заявление в ФНС онлайн, через Госуслуги или МФЦ. Основной код
      ОКВЭД — 56.30 (подача напитков) или 56.10 (кафе).
    prepare:
      - Паспорт и ИНН
      - Коды ОКВЭД 56.30 и 56.10
      - Для ООО — устав, решение учредителя, юридический адрес
      - Уведомление о налоговом режиме — можно подать вместе с заявлением
    done_when: Получен лист записи ЕГРИП или ЕГРЮЛ с кодами общепита.
    places: [ifns-18-kazan]
    source:
      url: https://www.consultant.ru/document/cons_doc_LAW_32881/2e1ce395bce6001a7d160331745d753122e1317e/
      title: 129-ФЗ, ст. 8 — сроки государственной регистрации (до 5 рабочих дней)
      checked_at: 2026-09-18
    kind: test_data

  - id: get-ukep
    title: Получить квалифицированную электронную подпись (УКЭП)
    lane: critical
    depends_on: [register-business]
    duration_days: 2
    why: >-
      Без УКЭП не зарегистрироваться в «Честном знаке», не подписывать документы поставщиков в ЭДО
      и не зарегистрировать кассу онлайн.
    do_now: Получите УКЭП на ИП или директора ООО в удостоверяющем центре ФНС и купите сертифицированный токен.
    prepare:
      - Паспорт, СНИЛС, ИНН
      - Сертифицированный токен (носитель подписи)
    done_when: Подпись установлена на рабочем компьютере и проходит проверку.
    source:
      url: https://markirovka.ru/community/horeca-/kak-restoranam-rabotat-s-markirovannoy-upakovannoy-vodoy
      title: «Честный знак» — как HoReCa работать с маркировкой (регистрация по УКЭП)
      checked_at: 2026-09-18
    kind: test_data

  - id: lease-premises
    title: Найти и арендовать помещение, пригодное для общепита
    lane: critical
    applies_if: { field: premises, eq: searching }
    depends_on: [register-business]
    duration_days: 30
    why: >-
      Помещение без воды, канализации и отдельной вентиляции дорого или невозможно переделать после
      подписания аренды — это самая частая причина сдвига открытия.
    do_now: >-
      До подписания проверьте горячую и холодную воду, канализацию, отдельную вытяжку, электрическую
      мощность, санузел для персонала и согласие собственника на общепит и вывеску.
    prepare:
      - Поэтажный план или техплан помещения
      - Выписка ЕГРН о собственнике
      - Данные о разрешённой мощности и вентиляции
      - Проект договора с целевым использованием «общественное питание»
    done_when: Договор аренды подписан (при сроке от года — зарегистрирован), помещение проходит чек-лист СанПиН.
    source:
      url: https://www.garant.ru/products/ipo/prime/doc/414229257/
      title: СанПиН 2.3/2.4.4282-26 — требования к организации общественного питания (с 01.09.2026)
      checked_at: 2026-09-18
    kind: test_data

  - id: check-premises
    title: Проверить помещение по требованиям СанПиН
    lane: critical
    applies_if: { field: premises, eq: signed }
    duration_days: 3
    why: >-
      Договор уже подписан — важно заранее найти то, что придётся переделать: воду, канализацию,
      вентиляцию, отделку под влажную уборку.
    do_now: >-
      Пройдите помещение по чек-листу: горячая и холодная вода, канализация, отдельная вытяжка,
      мощность, санузел для персонала. Если что-то не так — договоритесь с собственником о работах.
    prepare:
      - Договор аренды и план помещения
      - Сведения об инженерных сетях от собственника
    done_when: Составлен список работ по помещению, и с собственником согласовано, кто их делает.
    source:
      url: https://www.garant.ru/products/ipo/prime/doc/414229257/
      title: СанПиН 2.3/2.4.4282-26, п. 14, 18, 19 — размещение, инженерные системы, отделка
      checked_at: 2026-09-18
    kind: test_data

  - id: fit-out
    title: 'Оборудовать помещение: зоны, мойки, холодильники, вода и вентиляция'
    lane: critical
    depends_on: [lease-premises, check-premises]
    duration_days: 30
    due_days_before_opening: 3
    why: >-
      СанПиН требует исправных систем водоснабжения, водоотведения и вентиляции, отделки под влажную
      уборку и оборудования из материалов, безопасных для контакта с пищей.
    do_now: >-
      Нарисуйте план зон (приёмка и хранение, приготовление напитков, мойка, выдача, персонал)
      и закажите монтаж так, чтобы чистые и грязные потоки не пересекались.
    prepare:
      - План расстановки оборудования
      - Спецификация — кофемашина, мойки, холодильники с термометрами, водонагреватель
      - Документы на оборудование и посуду, контактирующие с пищей
    done_when: Оборудование смонтировано, вода, канализация и вентиляция работают.
    source:
      url: https://www.garant.ru/products/ipo/prime/doc/414229257/
      title: СанПиН 2.3/2.4.4282-26 — требования к оборудованию, инженерным системам и отделке
      checked_at: 2026-09-18
    kind: test_data

  - id: rpn-notification
    title: Подать уведомление о начале деятельности в сфере общепита
    lane: critical
    depends_on: [register-business, lease-premises, check-premises]
    duration_days: 1
    due_days_before_opening: 1
    why: >-
      Роспотребнадзор нужно уведомить до первой продажи — это касается и формата «кофе с собой».
      Работа без уведомления — административное нарушение.
    do_now: Подайте уведомление через Госуслуги после регистрации бизнеса, указав адрес точки.
    prepare:
      - ОГРН или ОГРНИП, ИНН
      - Адрес точки
      - Подтверждённая учётная запись ИП или юрлица на Госуслугах
    done_when: Уведомление принято и внесено в единый реестр уведомлений.
    places: [rospotrebnadzor-rt]
    source:
      url: https://www.consultant.ru/document/cons_doc_LAW_506214/225b3fb96536513d4d2996deed1755b80f28a32a/
      title: Постановление Правительства РФ № 725, приложение 1, раздел II — услуги общественного питания
      checked_at: 2026-09-18
    kind: test_data

  - id: kkt-registration
    title: Купить и зарегистрировать онлайн-кассу, заключить договор с ОФД
    lane: critical
    depends_on: [register-business, get-ukep, choose-tax-regime, lease-premises, check-premises]
    duration_days: 5
    due_days_before_opening: 1
    why: >-
      Каждая продажа должна проходить через зарегистрированную кассу, а чеки — уходить в ФНС через
      оператора фискальных данных. Касса должна поддерживать маркировку.
    do_now: >-
      Выберите кассу из реестра с фискальным накопителем и поддержкой маркировки, заключите договор
      с ОФД и зарегистрируйте кассу в личном кабинете ФНС.
    prepare:
      - Модель кассы и заводской номер
      - Фискальный накопитель
      - Договор с ОФД
      - УКЭП
      - Адрес установки кассы
    done_when: Получена карточка регистрации кассы, пробный чек дошёл до ОФД.
    source:
      url: https://www.consultant.ru/document/cons_doc_LAW_42359/7286ba3a2f39eba0ced5853cd23d6af88d657a9c/
      title: 54-ФЗ, ст. 4.2 — регистрация контрольно-кассовой техники
      checked_at: 2026-09-18
    kind: test_data

  - id: chestny-znak
    title: Зарегистрироваться в «Честном знаке» и подключить ЭДО
    lane: critical
    depends_on: [register-business, get-ukep]
    duration_days: 5
    due_days_before_opening: 3
    why: >-
      Кофейни обязаны принимать маркированные молоко, воду и напитки только через ЭДО и сообщать
      о выводе их из оборота. Без регистрации поставщик не сможет корректно отгрузить молоко.
    do_now: >-
      Зарегистрируйтесь в системе маркировки по УКЭП, подключите группы «Молочная продукция»,
      «Упакованная вода», «Безалкогольные напитки» и оператора ЭДО, сообщите поставщикам свой ИНН.
    prepare:
      - УКЭП
      - Оператор ЭДО
      - Список поставщиков молока и воды
    done_when: Личный кабинет активен, товарные группы подключены, первый УПД от поставщика принят.
    source:
      url: https://markirovka.ru/knowledge/tovarnye-gruppy/molochnaya-produkciya/dalneyshie-deystviya-posle-registratsii-horeca-moloko
      title: «Честный знак» — регистрация и дальнейшие действия HoReCa по молочной продукции
      checked_at: 2026-09-18
    kind: test_data

  - id: mercury-vetis
    title: Подключиться к ФГИС «Меркурий» для приёмки молочной продукции
    lane: critical
    depends_on: [register-business, lease-premises, check-premises]
    duration_days: 5
    due_days_before_opening: 3
    why: >-
      Молочная продукция приходит с электронным ветеринарным документом, который получатель
      обязан погасить при приёмке партии.
    do_now: >-
      Подайте заявку на доступ к «Меркурию» и регистрацию площадки по адресу точки или подключите
      гашение ВСД через личный кабинет «Честного знака».
    prepare:
      - Реквизиты ИП или ООО
      - Адрес площадки
      - ФИО и e-mail ответственного
    done_when: Площадка зарегистрирована, первый ветеринарный документ от поставщика погашен.
    source:
      url: https://base.garant.ru/406229479/f7ee959fd36b5699076b35abf4f52c5c/
      title: Приказ Минсельхоза № 862, приложение 2, п. 21 — гашение ВСД получателем
      checked_at: 2026-09-18
    kind: test_data

  - id: production-control
    title: Утвердить программу производственного контроля
    lane: critical
    depends_on: [lease-premises, check-premises]
    duration_days: 7
    due_days_before_opening: 1
    why: >-
      Производственный контроль обязателен для каждого предприятия общепита; программу первой
      запрашивают при проверке.
    do_now: >-
      Составьте программу — контрольные точки, журналы, график анализов воды и смывов, ответственные —
      и утвердите её приказом. Можно заказать у аккредитованной лаборатории.
    prepare:
      - Меню и ассортимент
      - План помещения и список оборудования
      - Договор с лабораторией
      - Формы журналов (гигиенический, температурный)
    done_when: Программа утверждена, журналы заведены, договор с лабораторией заключён.
    places: [cgie-rt]
    source:
      url: https://www.consultant.ru/document/cons_doc_LAW_22481/ecf7d99dfedfce263c69b78e069fa4ac904ab9c0/
      title: 52-ФЗ, ст. 32 — производственный контроль
      checked_at: 2026-09-18
    kind: test_data

  # ---------------- ops: команда и операционная готовность ----------------

  - id: check-okved
    title: Проверить коды ОКВЭД общепита в ЕГРИП или ЕГРЮЛ
    lane: ops
    applies_if: { field: legal_status, in: [ip, ooo] }
    duration_days: 5
    why: Если кодов 56.30 или 56.10 нет, их нужно добавить до начала работы точки.
    do_now: Посмотрите выписку из реестра на сайте ФНС и при необходимости подайте заявление на изменение кодов.
    prepare:
      - Свежая выписка ЕГРИП или ЕГРЮЛ
    done_when: Коды общепита есть в реестре.
    source:
      url: https://www.consultant.ru/document/cons_doc_LAW_32881/2e1ce395bce6001a7d160331745d753122e1317e/
      title: 129-ФЗ, ст. 8 — сроки регистрации изменений
      checked_at: 2026-09-18
    kind: test_data

  - id: choose-tax-regime
    title: 'Выбрать налоговый режим: УСН, патент или АУСН'
    lane: ops
    depends_on: [register-business]
    duration_days: 2
    due_days_before_opening: 10
    why: >-
      Режим определяет налоги и отчётность. Уведомление об УСН подаётся в течение 30 дней после
      регистрации, иначе до конца года — общая система.
    do_now: >-
      Сравните УСН 6% или 15%, патент (только ИП; в Казани доступен для точек с залом и без) и АУСН
      (до 5 работников) на своих цифрах. Для патента подайте заявление не позднее чем за 10 дней до начала работы.
    prepare:
      - Прогноз выручки и расходов на год
      - Планируемое число работников
      - Площадь зала обслуживания — для патента
    done_when: Уведомление об УСН или АУСН принято ФНС либо получен патент.
    source:
      url: https://www.nalog.gov.ru/rn16/taxation/taxes/usn/
      title: ФНС по Республике Татарстан — упрощённая система налогообложения
      checked_at: 2026-09-18
    kind: test_data

  - id: to-go-packaging
    title: Закупить одноразовую посуду и крышки для напитков навынос
    lane: ops
    applies_if: { field: format, eq: to_go }
    duration_days: 7
    due_days_before_opening: 2
    why: Для продажи навынос нужна посуда, разрешённая для пищевых продуктов; повторно её использовать нельзя.
    do_now: Выберите стаканы, крышки и держатели с документами о пригодности для пищевых продуктов и закажите первую партию.
    prepare:
