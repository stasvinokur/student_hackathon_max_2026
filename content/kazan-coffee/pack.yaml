# Пакет правил «Кофейня / coffee-to-go, Казань».
# Формат и правила проверки — content/README.md, порядок верификации — content/kazan-coffee/README.md.
# Все нормативные карточки версии 1.1.2 помечены kind: test_data — источники проверены автоматически
# (страница открыта и подтверждает требование), но ещё не прошли ручную проверку юристом.

manifest:
  id: kazan-coffee
  version: 1.1.2
  title: Кофейня / coffee-to-go, Казань
  region:
    code: kazan
    name: Казань
    aliases: [Kazan, Казань РТ]
    bbox: { south: 55.6, west: 48.8, north: 55.95, east: 49.4 }
  industry: coffee
  checked_at: 2026-09-18
  cities: [kazan]
  disclaimer: Маршрут справочный и не заменяет консультацию юриста или бухгалтера.

# Места шагов: адрес и назначение каждого места подтверждены официальным сайтом (source, дата — checked_at).
# Координаты — OpenStreetMap через Nominatim (© участники OpenStreetMap, ODbL): объект, с которого они взяты,
# указан в osm. note — только текст для пользователя, short_name — подпись метки на вкладке «Карта».
# Место без подтверждения на официальном сайте не добавляется.
places:
  - id: my-business-kazan
    name: Центр «Мой бизнес»
    short_name: Центр «Мой бизнес»
    address: Казань, ул. Петербургская, 28
    lat: 55.784258
    lon: 49.127051
    osm: node/9806747773
    note: Консультации и меры поддержки для начинающих предпринимателей.
    source:
      url: https://fpprt.ru/centers/centr-moj-biznes/
      title: Фонд поддержки предпринимательства РТ — центр «Мой бизнес»
      checked_at: 2026-09-23

  - id: ifns-18-kazan
    name: Межрайонная ИФНС России № 18 по Республике Татарстан
    short_name: ИФНС № 18
    address: Казань, ул. Владимира Кулагина, 1
    lat: 55.742130
    lon: 49.142156
    osm: way/92939129
    note: Регистрирующая инспекция — регистрирует ООО и ИП. Остановка «Регистрационная палата».
    source:
      url: https://www.nalog.gov.ru/rn16/ifns/16_mri18/
      title: ФНС России — Межрайонная ИФНС № 18 по Республике Татарстан
      checked_at: 2026-09-23

  - id: rospotrebnadzor-rt
    name: Управление Роспотребнадзора по Республике Татарстан
    short_name: Роспотребнадзор
    address: Казань, ул. Большая Красная, 30
    lat: 55.797571
    lon: 49.121010
    osm: node/12996321895
    note: Территориальный орган, который принимает уведомление о начале деятельности.
    source:
      url: https://16.rospotrebnadzor.ru/
      title: Управление Роспотребнадзора по Республике Татарстан
      checked_at: 2026-09-23

  - id: cgie-rt
    name: ФБУЗ «Центр гигиены и эпидемиологии в Республике Татарстан»
    short_name: Центр гигиены
    address: Казань, ул. Сеченова, 13а
