      Правила противопожарного режима требуют огнетушителей по нормам и допускают людей к работе
      только после инструктажа.
    do_now: >-
      Купите огнетушители по нормам, проведите инструктаж себе и сотрудникам с записью в журнал,
      проверьте с собственником сигнализацию и эвакуационные выходы.
    prepare:
      - Огнетушители с паспортами
      - Журнал инструктажей
      - План эвакуации, если требуется
