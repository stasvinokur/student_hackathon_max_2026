name: otkryvay

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otkryvay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-otkryvay}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: the init server of the image listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-otkryvay}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-otkryvay}
      BOT_MODE: ${BOT_MODE:-off}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MAX_WEB_APP: ${MAX_WEB_APP:-}
      INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-86400}
      REMINDER_DELAY_SECONDS: ${REMINDER_DELAY_SECONDS:-72000}
      REMINDER_POLL_SECONDS: ${REMINDER_POLL_SECONDS:-30}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-10000}
      LOCATION_INDEX_ENABLED: ${LOCATION_INDEX_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  miniapp:
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
    restart: unless-stopped
    ports:
      - "${MINIAPP_PORT:-8080}:80"

  # Throwaway database for integration tests: docker compose --profile test up -d --wait db-test
  db-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: otkryvay
      POSTGRES_DB: otkryvay_test
      # Local-only test database without a password, bound to 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55439}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: the init server of the image listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "otkryvay", "-d", "otkryvay_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-command test run: docker compose --profile test run --rm --build tests
  tests:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgres://otkryvay@db-test:5432/otkryvay_test
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  db-data:
